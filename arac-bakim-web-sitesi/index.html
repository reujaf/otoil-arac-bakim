<html lang="tr">

    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c4a6e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="OTOIL" />
    <meta name="application-name" content="OTOIL" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="OTOIL Araç Bakım Kayıt Sistemi - Müşteri bakımlarınızı kolayca yönetin, takip edin ve raporlayın" />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-pro-display" />
    <title>OTOIL - Araç Bakım Kayıt Sistemi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service Worker Registration for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // GitHub Pages için base path
          const basePath = window.location.pathname.split('/').slice(0, -1).join('/') || '/';
          const swPath = basePath === '/' ? '/sw.js' : basePath + '/sw.js';
          navigator.serviceWorker.register(swPath)
            .then((registration) => {
              console.log('Service Worker registered:', registration);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
      
      // Global error handler for uncaught errors
      window.addEventListener('error', (event) => {
        console.error('Uncaught error:', event.error);
      });
      
      window.addEventListener('unhandledrejection', (event) => {
        console.error('Unhandled promise rejection:', event.reason);
      });
    </script>
  </body>
</html>
